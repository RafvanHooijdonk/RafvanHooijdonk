name: 3D contributions

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # METRICS_TOKEN (personal token) also counts private repos, GITHUB_TOKEN is the fallback
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: 3d-settings.json
      - name: Remove language pie
        run: python3 scripts/trim_3d.py profile-3d-contrib/profile-rvh.svg
      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "Update 3D contribution graph"; then
            git pull --rebase && git push
          fi
