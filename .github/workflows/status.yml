name: Status

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - name: Update GitHub status every 15 minutes
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          for i in $(seq 1 23); do
            python3 scripts/status.py || true
            sleep $(( 900 - $(date +%s) % 900 + 5 ))
          done
