name: Stats card

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build stats card
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/stats_card.py
      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/stats-*.svg assets/tools-*.svg assets/stack-*.svg STATS.md
          if git commit -m "Update stats and tooling cards"; then
            git pull --rebase && git push
          fi
